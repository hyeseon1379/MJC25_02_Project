<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고민 상담소</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #FFF6F6;
        }

        .container {
            width: 1200px;
            margin: 20px auto 50px auto;
            padding: 40px 20px;
            flex-grow: 1;
        }

        /* 제목 */
        .title-area {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-area h2 {
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .title-area p {
            font-size: 14px;
            color: #888;
        }

        /* 카테고리 */
        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        .tab {
            padding: 12px 28px;
            border-radius: 25px;
            border: 2px solid #E0E0E0;
            background: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            border-color: #FFB8B8;
            background: #FFF5F5;
        }

        .tab.active {
            background: linear-gradient(135deg, #FFB8B8 0%, #FFA0A0 100%);
            color: white;
            border-color: transparent;
        }

        .emoji {
            font-size: 18px;
        }

        /* 게시글 리스트 */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 카드 */
        .post-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 6px 15px rgba(255, 143, 143, 0.15);
        }

        /* 태그 */
        .post-badge {
            background-color: #ff9d9d;
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-emoji {
            font-size: 0.9rem;
        }

        /* 제목 */
        .post-card h3 {
            font-size: 18px;
            margin: 10px 0 10px;
            color : #333333;
            font-weight: 700;

        }

        .post-card a{
            text-decoration: none;
        }

        .post-card h3:hover{
            color: #ff9d9d;
        }

        /* 내용 */
        .content {
            font-size: 14px;
            color: #888;
            line-height: 1.5;
            margin-bottom: 15px;
            margin-top: 5px;
        }

        .profile-img-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
        }

        /* 하단 정보 */
        .post-info-meta { /* 작성자, 시간, 조회수 등을 포함하는 메타 정보 영역 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #999;
            padding-top: 10px;
        }



        /* ⭐ 1. 프로필 사진과 상세 정보를 가로로 배치 */
        .post-meta-text { /* 프로필 사진(왼쪽)과 상세 정보(오른쪽)를 감싸는 컨테이너 */
            display: flex;
            align-items: center; /* 이미지와 텍스트를 수직 중앙 정렬 */
            color: #888;
        }



        /* ⭐ 2. 원형 프로필 이미지 스타일 */
        .profile-img-small { /* 작성자 프로필 이미지 스타일 */
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }



        /* ⭐ 3. 작성자 이름과 날짜/시간을 수직으로 담는 컨테이너 */
        .post-writer-details {
            display: flex;
            flex-direction: column; /* 세로 정렬 */
            margin-left: 8px; /* 프로필 사진과의 간격 */
        }



        /* ⭐ 4. 날짜와 작성 시간을 담는 컨테이너 */
        .post-date-time {
            display: flex;
            margin-top: 2px; /* 작성자 이름과의 세로 간격 */
            font-size: 0.8rem;
            color: #999;
        }

        .post-date-time span { /* 날짜와 시간 항목 */
            margin-right: 10px;
        }

        .post-counts span {
            margin-left: 6px;
        }

        .post-card-empty{
            margin : 0 auto;
            padding: 40px;
            min-height: 360px;
        }

        .post-action-buttons {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .post-action-btn {
            display: inline-flex;
            align-items: center;
            padding: 15px;
            border-radius: 30px;
            border: 1px solid #ddd;
            background-color: #ff9d9d;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .post-action-btn:hover {
            background-color: #f8f8f8;
            border-color: #bbb;
        }

        .post-action-btn i {
            font-size: 1rem;
        }

        .post-action-btn.edit-btn:hover {
            background-color: #fde3e8;
            border-color: #fb7878;
            color: #fd8686;
        }
        .post-header {
            padding-bottom: 5px;
            position: relative;
        }
    </style>
</head>
<body>
<nav th:replace="~{layout/header :: header-fragment}"></nav>
<div class="container">

    <!-- 제목 영역 -->
    <div class="title-area">
        <h2>고민 상담소</h2>
        <p>당신의 고민을 나누어 함께 해결해요</p>
    </div>

    <input type="hidden" id="categoryHidden" name="trouble" value="연애">
    <!-- 카테고리 버튼 -->
    <div class="post-header">
    <div class="category-tabs">
        <button type="button" class="tab active" onclick="selectCategory(this, '전체')">
            <span>전체</span>
        </button>
        <button type="button" class="tab" onclick="selectCategory(this, '연애')">
            <span class="emoji">❤️</span>
            <span>연애</span>
        </button>
        <button type="button" class="tab" onclick="selectCategory(this, '친구')">
            <span class="emoji">😊</span>
            <span>친구</span>
        </button>
        <button type="button" class="tab" onclick="selectCategory(this, '직장')">
            <span class="emoji">💼</span>
            <span>직장</span>
        </button>
        <button type="button" class="tab" onclick="selectCategory(this, '기타')">
            <span class="emoji">💭</span>
            <span>기타</span>
        </button>
    </div>

    <div  class="post-action-buttons" th:if="${session.loginUser != null}">
        <a th:href="@{/post/new}" class="post-action-btn edit-btn">
            <i class="fas fa-edit"></i>
        </a>
    </div>
    </div>
    <!-- 고민 목록 -->
    <div class="post-list">

        <div class="post-card" th:each="post : ${posts}">

            <span class="post-badge">
                <span class="badge-emoji"
                      th:text="${post.trouble == '연애' ? '❤️' : (post.trouble == '친구' ? '😊' : (post.trouble == '직장' ? '💼' : '💭'))}">
                </span>
                <span th:text="${post.trouble}">연애</span>
            </span>
            <a th:href="@{/post/{id}(id=${post.id})}">
                <h3 th:text="${post.title}">고백을 받았는데 어떻게 대답해야 할지 모르겠어요.</h3>
            </a>

            <p class="content" th:text="${#strings.abbreviate(post.content, 100)}">
                친한 선배가 갑자기 고백을 했는데, 사실 선배에 대한 감정이 애매해서...
            </p>

            <div class="post-info-meta">
                <div class="post-meta-text">
                    <img class="profile-img-small" src="https://img.freepik.com/free-photo/photo-wall-texture-pattern_58702-15193.jpg?semt=ais_hybrid&w=740&q=80" alt="프로필 사진">

                    <div class="post-writer-details">
                        <span class="fw-bold" th:text="${post.writer}">익명의 나비</span>

                        <div class="post-date-time">
                            <span th:text="${#temporals.format(post.createdAt, 'yy년 MM월 dd일')}">2025년 11월 23일</span>
                        </div>
                    </div>
                </div>
                <div class="post-counts">
                    <span class="text-secondary"><i class="far fa-eye me-1"></i> <span th:text="${post.viewCount}">123</span></span>
                    <span class="text-secondary"><i class="far fa-comment-dots me-1"></i> <span th:text="${post.commentCount}">57</span></span>
                </div>
            </div>
        </div>

        <div class="post-card-empty" th:if="${posts.isEmpty()}">
            <p style="text-align: center; color: #999;">작성된 게시글이 없습니다.</p>
        </div>

    </div>
</div>

<script>
    let selectedCategory = '연애';
    const categoryHidden = document.getElementById('categoryHidden');
    function selectCategory(element, trouble) {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });

        element.classList.add('active');
        selectedCategory = trouble;
        categoryHidden.value = trouble;

        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        element.classList.add('active');

        let targetUrl = '/post';
        let queryParam = '';

        if (trouble && trouble !== '전체') {
            queryParam = '?trouble=' + trouble;
        }

        window.location.href = targetUrl + queryParam
    }

    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const currentTrouble = urlParams.get('trouble');

        document.querySelectorAll('.category-tabs .tab').forEach(button => {
            const troubleNameSpan = button.querySelector('span:last-child');
            const tabName = troubleNameSpan ? troubleNameSpan.textContent.trim() : '';

            button.classList.remove('active');

            if (currentTrouble === null && tabName === '전체') {
                button.classList.add('active');
            } else if (tabName === currentTrouble) {
                button.classList.add('active');
            }
        });
    });
</script>

<div th:replace="~{layout/footer.html :: footer}"></div>
</body>
</html>
