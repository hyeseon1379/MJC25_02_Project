<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고민 상담소 - 글쓰기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <style>
        body {
            background: linear-gradient(180deg, #FFF5F5 0%, #FFE8E8 100%);
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        .tab {
            padding: 12px 28px;
            border-radius: 25px;
            border: 2px solid #E0E0E0;
            background: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            border-color: #FFB8B8;
            background: #FFF5F5;
        }

        .tab.active {
            background: linear-gradient(135deg, #FFB8B8 0%, #FFA0A0 100%);
            color: white;
            border-color: transparent;
        }

        .emoji {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .input-field {
            width: 100%;
            padding: 18px 24px;
            border: 2px solid #F0F0F0;
            border-radius: 15px;
            font-size: 15px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.3s;
            outline: none;
        }

        .input-field:focus {
            border-color: #FFB8B8;
            background: #FFF9F9;
        }

        .input-field::placeholder {
            color: #CCC;
        }

        .textarea-field {
            width: 100%;
            padding: 24px;
            border: 2px solid #F0F0F0;
            border-radius: 15px;
            font-size: 15px;
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 280px;
            resize: vertical;
            transition: all 0.3s;
            outline: none;
            line-height: 1.8;
        }

        .textarea-field:focus {
            border-color: #FFB8B8;
            background: #FFF9F9;
        }

        .textarea-field::placeholder {
            color: #CCC;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            padding: 16px 45px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-cancel {
            background: white;
            color: #999;
            border: 2px solid #E0E0E0;
        }

        .btn-cancel:hover {
            background: #F5F5F5;
            border-color: #CCC;
        }

        .btn-submit {
            background: linear-gradient(135deg, #FFB8B8 0%, #FF9999 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 153, 153, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 153, 0.4);
        }

        .char-count {
            text-align: right;
            color: #999;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .category-tabs {
                flex-wrap: wrap;
            }

            .tab {
                padding: 10px 20px;
                font-size: 14px;
            }

            .textarea-field {
                min-height: 200px;
            }

            .btn {
                padding: 14px 35px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
<nav th:replace="~{layout/header :: header-fragment}"></nav>
<div class="container">
    <form th:action="@{/post/new}" method="post" id="postForm">
        <input type="hidden" id="categoryHidden" name="trouble" value="연애">
    <div class="category-tabs">
        <button type="button" class="tab active" onclick="selectCategory(this, '연애')">
            <span class="emoji">❤️</span>
            <span>연애</span>
        </button>
        <button type="button" class="tab" onclick="selectCategory(this, '친구')">
            <span class="emoji">😊</span>
            <span>친구</span>
        </button>
        <button type="button" class="tab" onclick="selectCategory(this, '직장')">
            <span class="emoji">💼</span>
            <span>직장</span>
        </button>
        <button type="button" class="tab" onclick="selectCategory(this, '기타')">
            <span class="emoji">💭</span>
            <span>기타</span>
        </button>
    </div>

    <div class="form-group">
        <input
                type="text"
                class="input-field"
                placeholder="제목을 입력하세요"
                id="titleInput"
                name="title"
                maxlength="100"
        >
    </div>

    <div class="form-group">
            <textarea
                    class="textarea-field"
                    placeholder="내용을 입력하세요"
                    id="contentInput"
                    name="content"
                    maxlength="2000"
            ></textarea>
        <div class="char-count">
            <span id="charCount">0</span> / 2000
        </div>
    </div>

    <div class="action-buttons">
        <button type="button" class="btn btn-cancel" onclick="handleCancel()">뒤로가기</button>
        <button type="submit" class="btn btn-submit">게시 작성</button>
    </div>
    </form>
</div>

<script>
    let selectedCategory = '연애';
    const postForm = document.getElementById('postForm');
    const categoryHidden = document.getElementById('categoryHidden');
    // 카테고리 선택
    function selectCategory(element, trouble) {
        // 모든 탭에서 active 제거
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });

        // 선택된 탭에 active 추가
        element.classList.add('active');
        selectedCategory = trouble;
        categoryHidden.value = trouble;
    }

    // 글자 수 카운트
    const contentInput = document.getElementById('contentInput');
    const charCount = document.getElementById('charCount');

    contentInput.addEventListener('input', function() {
        const length = this.value.length;
        charCount.textContent = length;
    });

    // 취소 버튼
    function handleCancel() {
        if (confirm('작성 중인 내용이 사라집니다. 정말 나가시겠습니까?')) {
            window.history.back();
        }
    }

    // 제출 버튼
    postForm.addEventListener('submit', function(event) {
        const title = document.getElementById('titleInput').value.trim();
        const content = document.getElementById('contentInput').value.trim();

        if (!title) {
            alert('제목을 입력해주세요.');
            event.preventDefault(); // 제출 중단
            return;
        }

        if (!content) {
            alert('내용을 입력해주세요.');
            event.preventDefault(); // 제출 중단
            return;
        }
    });
</script>
<div th:replace="~{layout/footer.html :: footer}"></div>
</body>
</html>
