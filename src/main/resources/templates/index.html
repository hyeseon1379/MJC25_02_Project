<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mind:ON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background-color: white; border-bottom: 1px solid #eee;
        }

        .logo { font-size: 24px; font-weight: bold; color: #ff6b81; }

        .menu a { margin: 0 15px; text-decoration: none; color: #333; font-weight: 500; }

        .auth button {
            margin-left: 10px; padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer;
        }

        .login { background-color: #f1f1f1; }
        .signup { background-color: #ff6b81; color: white; }

        .content { min-height: 400px; background-color: #fff5f7; padding: 40px; }

        .box {
            width: 600px; margin: 0 auto; background: white; border-radius: 20px;
            padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        input {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border-radius: 10px; border: 1px solid #ddd;
        }

        textarea {
            width: 100%; height: 260px; padding: 12px;
            border-radius: 10px; border: 1px solid #ddd; resize: none;
        }

        .select-box {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border-radius: 10px; border: 1px solid #ddd;
        }

        .emoji-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .emoji-btn {
            flex: 1;
            padding: 10px;
            margin-right: 5px;
            border-radius: 12px;
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .emoji-btn.active {
            background-color: #ffeff3;
            border-color: #ff6b81;
            color: #ff6b81;
        }

        .emoji-btn:last-child { margin-right: 0; }

        .footer {
            background-color: #333; color: white; text-align: center;
            padding: 20px 0; font-size: 14px;
        }
    </style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="header">
    <div class="logo">💗 ON</div>

    <nav class="menu">
        <a href="#">대화</a>
        <a href="#">궁합</a>
        <a href="#">MBTI</a>
        <a href="#">고민 상담소</a>
    </nav>

    <div class="auth">
        <button class="login">로그인</button>
        <button class="signup">회원가입</button>
    </div>
</header>

<!-- 메인 콘텐츠 -->
<main class="content">
    <div class="box">

        <!-- trouble 선택 -->
        <div class="emoji-bar">
            <button type="button" class="emoji-btn"
                    th:classappend="${post.trouble == 'LOVE'} ? ' active' : ''">💗 연애</button>
            <button type="button" class="emoji-btn"
                    th:classappend="${post.trouble == 'FRIEND'} ? ' active' : ''">😊 친구</button>
            <button type="button" class="emoji-btn"
                    th:classappend="${post.trouble == 'LOVE'} ? ' active' : ''">💬 대화</button>
            <button type="button" class="emoji-btn"
                    th:classappend="${post.trouble == 'LOVE'} ? ' active' : ''">💭 고민</button>
        </div>

        <!-- 수정 form -->
        <form th:action="@{'/posts/' + ${post.id} + '/edit'}" method="post">

            <!-- trouble 값 hidden 으로 전달 -->
            <input type="hidden" name="trouble" th:value="${post.trouble}"/>

            <!-- 제목 -->
            <input type="text" name="title" th:value="${post.title}" placeholder="제목을 입력하세요">

            <!-- 내용 -->
            <textarea name="content" th:text="${post.content}"></textarea>

            <button type="submit"
                    style="margin-top: 10px; width: 100%; padding: 12px; background-color:#ff6b81; color:white;
                           border:none; border-radius:10px; cursor:pointer;">
                수정 완료
            </button>
        </form>

    </div>
</main>

<!-- 하단 푸터 -->
<footer class="footer">
    <p>© 2024 Mind:ON. All rights reserved.</p>
    <p>Relationship Temperature Analysis Service</p>
</footer>

</body>
</html>
