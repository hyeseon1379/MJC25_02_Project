<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>궁합 분석 - Chemistry ON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background-color: #f9f9f9;
        }

        /* Header */
        header {
            background-color: white;
            padding: 20px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .logo::before {
            content: "❤️";
            margin-right: 8px;
            font-size: 22px;
        }

        nav {
            display: flex;
            gap: 60px;
            margin-left: 80px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-login {
            padding: 11px 26px;
            border: 1px solid #ffb8c1;
            background: white;
            color: #ff7a8a;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-signup {
            padding: 11px 26px;
            background: #ffb8c1;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        /* Main Content */
        .main-container {
            max-width: 1040px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #e0e0e0, transparent);
            margin-bottom: 50px;
        }

        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            gap: 14px;
            margin-bottom: 50px;
        }

        .filter-btn {
            padding: 11px 24px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            font-weight: 500;
        }

        .filter-btn.active {
            background: #F8A9A7;
            color: white;
            border-color: #F8A9A7;
        }

        /* Form Container */
        .form-wrapper {
            display: flex;
            gap: 50px;
            align-items: center;
            margin-bottom: 50px;
        }

        .person-form {
            flex: 1;
            background: #FFF6F6;
            padding: 40px 35px;
            border-radius: 20px;
        }

        .form-title {
            color: #ff8a95;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-label {
            color: #333;
            font-size: 14px;
            font-weight: 600;
            min-width: 70px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 13px 18px;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            background: white;
        }

        input[type="text"]::placeholder {
            color: #c5c5c5;
        }

        input[type="date"] {
            flex: 1;
            padding: 13px 18px;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            color: #333;
        }

        .calendar-icon {
            cursor: pointer;
            font-size: 20px;
        }

        .gender-buttons {
            flex: 1;
            display: flex;
            gap: 12px;
        }

        .gender-btn {
            flex: 1;
            padding: 13px;
            border: 1px solid #e8e8e8;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .gender-btn.active {
            background: #F8A9A7;
            color: white;
            border-color: #F8A9A7;
        }

        /* Heart Icon */
        .heart-divider {
            flex-shrink: 0;
            font-size: 80px;
            filter: drop-shadow(0 2px 8px rgba(248, 169, 167, 0.3));
        }

        /* Submit Button */
        .submit-container {
            text-align: center;
            margin-top: 70px;
        }

        .btn-submit {
            padding: 18px 90px;
            background: #F8A9A7;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(248, 169, 167, 0.35);
            font-weight: 600;
        }

        .btn-submit:hover {
            background: #ff9ba3;
            box-shadow: 0 6px 20px rgba(248, 169, 167, 0.45);
        }

        /* Footer */
        footer {
            background: #3d3d3d;
            color: #8a8a8a;
            text-align: center;
            padding: 35px 20px;
            margin-top: 120px;
            font-size: 13px;
            line-height: 1.8;
        }

        footer div:last-child {
            margin-top: 5px;
        }
    </style>
</head>
<body>
<!-- Header -->
<header>
    <div class="header-container">
        <div class="logo">ON</div>
        <nav>
            <a href="#">대화</a>
            <a href="#">궁합</a>
            <a href="#">MBTI</a>
            <a href="#">고민 상담소</a>
        </nav>
        <div class="header-buttons">
            <button class="btn-login">로그인</button>
            <button class="btn-signup">회원가입</button>
        </div>
    </div>
</header>

<!-- Main Content -->
<div class="main-container">
    <h1>궁합 분석</h1>
    <div class="divider"></div>

    <div class="filter-buttons">
        <button class="filter-btn active">💕 연인</button>
        <button class="filter-btn">🎨 친구</button>
        <button class="filter-btn">📚 동료</button>
    </div>

    <div class="form-wrapper">
        <!-- Me -->
        <div class="person-form">
            <div class="form-title">내 정보</div>

            <div class="form-group">
                <div class="form-row">
                    <label class="form-label">이름</label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="홍길동" id="myName">
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">생년월일</label>
                    <div class="input-wrapper">
                        <input type="date" value="2004-06-04" id="myBirth">
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">성별</label>
                    <div class="gender-buttons">
                        <button class="gender-btn" id="myMale">남성</button>
                        <button class="gender-btn active" id="myFemale">여성</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Heart Icon in Center -->
        <div class="heart-divider">❤️</div>

        <!-- Partner -->
        <div class="person-form">
            <div class="form-title">상대 정보</div>

            <div class="form-group">
                <div class="form-row">
                    <label class="form-label">이름</label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="마음을 담아보세요" id="partnerName">
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">생년월일</label>
                    <div class="input-wrapper">
                        <input type="date" placeholder="2004-06-04" id="partnerBirth">
                        <span class="calendar-icon">📅</span>
                    </div>
                </div>

                <div class="form-row">
                    <label class="form-label">성별</label>
                    <div class="gender-buttons">
                        <button class="gender-btn" id="partnerMale">남성</button>
                        <button class="gender-btn" id="partnerFemale">여성</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="submit-container">
        <button class="btn-submit">궁합 예측</button>
    </div>
</div>

<!-- Footer -->
<footer>
    <div>© 2024 Mind:ON. All rights reserved.</div>
    <div>Relationship Temperature Analysis Service</div>
</footer>

<script>
    // Gender button toggle
    document.querySelectorAll('.gender-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const parent = this.parentElement;
            parent.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Filter button toggle
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // 궁합 예측 버튼 클릭
    document.querySelector('.btn-submit').addEventListener('click', async function() {
        // 입력값 수집
        const myName = document.getElementById('myName').value.trim();
        const myBirth = document.getElementById('myBirth').value;
        const myGender = document.querySelector('#myFemale').classList.contains('active') ? '여성' : '남성';

        const partnerName = document.getElementById('partnerName').value.trim();
        const partnerBirth = document.getElementById('partnerBirth').value;
        const partnerGenderMale = document.getElementById('partnerMale');
        const partnerGender = partnerGenderMale.classList.contains('active') ? '남성' : '여성';

        // 관계 타입 추출 (이모지 제거)
        const relationshipText = document.querySelector('.filter-btn.active').textContent.trim();
        const relationship = relationshipText.replace(/[💕🎨📚]/g, '').trim();

        // 유효성 검사
        if (!myName || !myBirth || !partnerName || !partnerBirth) {
            alert('모든 정보를 입력해주세요.');
            return;
        }

        // 로딩 표시
        const submitBtn = this;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = '분석 중...';
        submitBtn.disabled = true;

        try {
            // API 호출
            const response = await fetch('/api/chemistry/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    relationship: relationship,
                    myName: myName,
                    myBirthDate: myBirth,
                    myGender: myGender,
                    partnerName: partnerName,
                    partnerBirthDate: partnerBirth,
                    partnerGender: partnerGender
                })
            });

            if (response.ok) {
                const resultText = await response.text();

                // JSON 추출 (마크다운 제거)
                let jsonString = resultText.trim();
                if (jsonString.includes('```json')) {
                    jsonString = jsonString.substring(jsonString.indexOf('{'), jsonString.lastIndexOf('}') + 1);
                }

                const result = JSON.parse(jsonString);

                // 결과를 localStorage에 저장
                localStorage.setItem('chemistryResult', JSON.stringify(result));
                localStorage.setItem('chemistryInput', JSON.stringify({
                    myName, myBirth, myGender,
                    partnerName, partnerBirth, partnerGender,
                    relationship
                }));

                // 결과 페이지로 이동
                window.location.href = '/api/chemistry/result';
            } else {
                alert('궁합 분석에 실패했습니다. 다시 시도해주세요.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('네트워크 오류가 발생했습니다.');
        } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
